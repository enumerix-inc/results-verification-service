# ---------------------------------------------------------------
# Results Verification Service — configuration
#
# Copy this file to config/local_config.yaml and update paths
# for your machine. local_config.yaml is gitignored.
# ---------------------------------------------------------------

paths:
  manifests_dir:      "F:/RegressionTesting/manifests"  # files named: context_manifest_{run_id}.json
  gold_standards_dir: "F:/RegressionTesting/gold_standards"
  workbooks_dir:      "F:/RegressionTesting/workbooks"
  database:           "F:/RegressionTesting/verification.db"
  reports_dir:        "F:/RegressionTesting/reports"
  results_dir:        "F:/CountableLabs/data"

  # E: drive — pipeline temporary storage (ADR-019)
  e_drive_report_data: "E:/CountableLabs/ReportData"
  e_drive_metafolder:  "E:/CountableLabs/Data/metafolder"  # future use

  # F: drive — archival storage (what we read from)
  metadata_dir:        "F:/CountableLabs/metadata"          # future use

pipeline:
  # Connection string for the central pipeline database
  # Placeholder only. Real credentials go in config/local_config.yaml (gitignored),
  # never in this tracked file.
  database_connection: "postgresql://<user>:<password>@localhost:5432/countablelabs"
  # How often to poll for completed runs (seconds)
  polling_interval_seconds: 30

listener:
  # Set to true to use the mock listener (no pipeline DB required)
  use_mock: false

# Manifest schema note:
# experiment entries use "comparisons" list (ADR-016), NOT "sample_tolerances"
# e.g. "comparisons": [{"type": "count_tolerance", "columns": ["some_column"], "tolerance_percent": 10.0}]

verification:
  # Default tolerance used when no experiment-specific tolerance is set
  default_tolerance_percent: 10.0
  # Seconds to wait for E: drive deletion before aborting the watch (ADR-019)
  e_drive_deletion_timeout_seconds: 600

llm:
  # Anthropic model to use for report generation
  model: "claude-sonnet-4-20250514"
  max_tokens: 1000

name: Trigger Regression Run

# ADR-023: manual entry point for the regression testing system.
#
# This workflow does NOT build or install anything. The expected sequence
# (still manual outside this workflow) is: build the pipeline, install it
# on the regression machine, THEN dispatch this workflow to kick off a
# run against whatever is now installed. See ADR-023 for why installation
# stays manual for now.
#
# Fire-and-forget by design: this job waits for the test harness process
# to exit, but does NOT wait for the verification service to pick up and
# verify the resulting run — that happens asynchronously, on its own
# schedule, watched separately. Check the service's own logs/DB for the
# verdict.

on:
  workflow_dispatch:
    inputs:
      pipeline_build:
        description: >-
          Build identifier of the pipeline/IAP build currently installed
          on the regression machine (e.g. "3.0.0.2977"). Recorded on the
          manifest as-is — this workflow does not verify it against what's
          actually installed, so double check before dispatching.
        required: true
        type: string
      scenario:
        description: "Scenario name recorded on the manifest."
        required: false
        type: string
        default: "new_build_regression_baseline"
      runner_label:
        description: >-
          Label of the self-hosted runner to run on. Leave as pcr-regression
          for the real regression machine; use pcr-regression-test to target
          a test runner registered with that label.
        required: false
        type: string
        default: pcr-regression
      template:
        description: >-
          Which manifest template to stamp. "full" runs every experiment in
          manifest_template.json (the real regression run). "single" runs only
          the one experiment in manifest_template_single.json - quick, for
          smoke-testing the pipeline end to end.
        required: false
        type: choice
        options:
          - full
          - single
        default: full
      harness_timeout_minutes:
        description: >-
          Cap, in minutes, on how long the harness step may run. The harness
          does not exit until reanalysis of every experiment finishes, and a
          multi-experiment run takes hours.
        required: false
        type: number
        default: 720

# The self-hosted runner is one physical regression machine — only one
# run can meaningfully happen on it at a time anyway, but make that
# explicit rather than relying on there only ever being one runner online.
concurrency:
  group: pcr-regression-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]

    # Dispatch inputs are exposed as real environment variables here rather
    # than being interpolated as `${{ inputs.* }}` text directly into any
    # `run:` script below (PR review, session 15): a `${{ }}` expression is
    # substituted into the step's script *before* PowerShell ever parses
    # it, so a value like `foo"; Remove-Item -Recurse C:\; #` would close
    # the quoted argument and execute arbitrary commands on this runner.
    # `env:` assignment doesn't have that problem — the runner sets an
    # actual process environment variable, and `$env:NAME` expansion inside
    # the script is a normal runtime string read, not a script-text splice.
    # Every step below that needs an input value reads it via $env:, never
    # via ${{ inputs.* }} in a run: block.
    env:
      PIPELINE_BUILD: ${{ inputs.pipeline_build }}
      SCENARIO: ${{ inputs.scenario }}
      TEMPLATE: ${{ inputs.template }}

    steps:
      - name: Checkout results-verification-service
        uses: actions/checkout@v6
        with:
          # This workspace persists on the regression machine between runs
          # (it is not a fresh VM per job like a GitHub-hosted runner). The
          # default `clean: true` runs `git clean -ffdx`, which deletes
          # *ignored* files too — that would wipe config/local_config.yaml
          # (this machine's real paths/credentials) and .venv on every
          # single dispatch. Keep clean off; this repo has no build
          # artifacts in its own tree that would need clearing anyway.
          clean: false

      - name: Ensure Python virtual environment
        shell: pwsh
        run: |
          if (-not (Test-Path ".venv\Scripts\python.exe")) {
            python -m venv .venv
          }
          & ".venv\Scripts\python.exe" -m pip install --quiet -r requirements.txt

      - name: Stamp a new run manifest
        id: stamp
        shell: pwsh
        # The harness only runs Reanalysis (--reanalysis-only, below), so the
        # run type is fixed here rather than being a dispatch input.
        run: |
          $template = if ($env:TEMPLATE -eq "single") {
            "entry_point\manifest_template_single.json"
          } else {
            "entry_point\manifest_template.json"
          }
          & ".venv\Scripts\python.exe" entry_point\stamp_manifest_for_run.py `
            --pipeline-build "$env:PIPELINE_BUILD" `
            --scenario "$env:SCENARIO" `
            --run-type Reanalysis `
            --template $template

      - name: Run the test harness
        id: harness
        shell: pwsh
        # COUNTABLE_PCR_REGRESSION_TEST_MANIFEST_PATH must be the manifests
        # *folder* (Countable.Pcr.TestHarness/Program.cs globs it), i.e.
        # the same value as this repo's config.paths.manifests_dir on this
        # machine. Set these repo variables once in
        # Settings -> Secrets and variables -> Actions -> Variables:
        #   PCR_MANIFESTS_DIR          the manifests folder (as above)
        #   PCR_TEST_HARNESS_EXE_PATH  full path to Countable.Pcr.TestHarness.exe
        #   PCR_APP_INSTALL_DIR        optional; defaults to
        #     C:\Program Files\Countable Labs\Countable Control Software
        #
        # The harness resolves its Config\ and appsettings.json relative to
        # the current directory, so this step starts in the app's install
        # folder (the equivalent of the old shortcut's "Start in"). It also
        # restarts CountableAnalysisService and carries a requireAdministrator
        # manifest, so the runner must run elevated.
        #
        # --reanalysis-only skips instrument hardware initialization; the
        # harness refuses any manifest that contains an Imaging experiment.
        #
        # An unhandled harness error prints [FATAL] and exits 1 (it no longer
        # waits for a keypress when input is redirected), so a failure shows
        # up as a failed step. The timeout is a safety cap for a genuinely
        # stuck run; it is a dispatch input because multi-experiment runs
        # take hours.
        timeout-minutes: ${{ fromJSON(inputs.harness_timeout_minutes) }}
        env:
          COUNTABLE_PCR_REGRESSION_TEST_MANIFEST_PATH: ${{ vars.PCR_MANIFESTS_DIR }}
          HARNESS_EXE: ${{ vars.PCR_TEST_HARNESS_EXE_PATH }}
          APP_DIR: ${{ vars.PCR_APP_INSTALL_DIR }}
        run: |
          if (-not $env:HARNESS_EXE) {
            Write-Error "Repo variable PCR_TEST_HARNESS_EXE_PATH is not set."
            exit 1
          }
          $appDir = if ($env:APP_DIR) { $env:APP_DIR } else { "C:\Program Files\Countable Labs\Countable Control Software" }
          Set-Location -LiteralPath $appDir
          & $env:HARNESS_EXE --reanalysis-only
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Test harness exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Summary
        if: always()
        shell: pwsh
        # Report what actually happened rather than assuming success:
        # `if: always()` means this step still runs after the stamp or
        # harness step fails, so it must check their outcomes rather than
        # unconditionally printing success text (PR review, session 15) —
        # otherwise a failed stamp (no manifest, no harness ever started)
        # or a timed-out/nonzero-exit harness would both read as a normal
        # "run triggered" in the job summary, which is exactly the
        # information an operator needs to get right during a failure.
        run: |
          $stampOutcome = "${{ steps.stamp.outcome }}"
          $harnessOutcome = "${{ steps.harness.outcome }}"

          function Write-Summary($line) {
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          if ($stampOutcome -ne "success") {
            Write-Summary "### Regression run FAILED — manifest stamping failed"
            Write-Summary ""
            Write-Summary "The harness was never started. See the 'Stamp a new run manifest' step log above for why (a common cause: an unarchived manifest already sitting in manifests_dir — see ADR-023's safety check)."
          } elseif ($harnessOutcome -ne "success") {
            Write-Summary "### Regression run PARTIALLY FAILED — harness did not complete successfully"
            Write-Summary ""
            Write-Summary "- **run_id:** ${{ steps.stamp.outputs.run_id }}"
            Write-Summary "- **manifest:** ``${{ steps.stamp.outputs.manifest_path }}``"
            Write-Summary ""
            Write-Summary "A manifest was stamped, but the test harness step did not exit successfully — either it returned a nonzero exit code (an unhandled error prints [FATAL] and exits 1) or it hit the harness_timeout_minutes cap. Check the 'Run the test harness' step log. The stamped manifest is still sitting in manifests_dir unarchived — the running verification service will eventually move it to timed_out/ once its own E: drive watch times out, but it will not be verified."
          } else {
            Write-Summary "### Regression run triggered"
            Write-Summary ""
            Write-Summary "- **run_id:** ${{ steps.stamp.outputs.run_id }}"
            Write-Summary "- **manifest:** ``${{ steps.stamp.outputs.manifest_path }}``"
            Write-Summary "- **pipeline_build:** $env:PIPELINE_BUILD"
            Write-Summary "- **scenario:** $env:SCENARIO"
            Write-Summary "- **template:** $env:TEMPLATE"
            Write-Summary "- **run_type:** Reanalysis (harness runs with --reanalysis-only)"
            Write-Summary ""
            Write-Summary "The harness process has exited successfully. Verification happens asynchronously — check the verification service for the actual result."
          }
